server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16m;

    # O Compose pode recriar o backend com outro IP (troca de imagem, env ou volume).
    # 127.0.0.11 é o DNS embutido da rede do Docker. Sem resolver e sem variável no
    # proxy_pass, o nginx congela o IP resolvido no boot e passa a devolver 502
    # depois de qualquer recriação do backend.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    location /api/music/stream/ {
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Range $http_range;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Sem isto o nginx corta em 60 s (padrão) e devolve 504 enquanto o backend ainda trabalha:
        # /api/chat soma a consulta externa da ferramenta (12 s por chamada) ao Ollama
        # (CHAT_TIMEOUT_SECONDS, 180 s) e /api/audio soma transcrição + chat + síntese.
        # 300 s cobre o pior caso e é o mesmo orçamento do curl do healthcheck.
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass $backend_upstream;
    }

    # JS e CSS mudam junto com o código: sem cache, o navegador sempre pega a versão atual
    # (evita rodar uma interface antiga depois de um rebuild).
    location ~* \.(?:js|css)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
