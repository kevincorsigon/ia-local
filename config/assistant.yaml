assistant:
  name: Kunica
  personality: "Amigável, espontânea e direta."
  language: pt-BR
  wake_phrases:
    - kunica
    - tvzinha
    - televisão
    - minha puta
  # Formas que os motores de fala escrevem no lugar das alcunhas — medidas neste projeto com o
  # Vosk grande, o Vosk pequeno e o Whisper. "Kunica" e "TVzinha" não existem no dicionário de
  # nenhum deles, então cada motor escreve uma palavra parecida. Entram aqui só formas que NÃO
  # são palavras comuns do português: é isso que faz a alcunha acionar sem transformar "a única
  # coisa" ou "minha vizinha" em disparo por engano.
  wake_variants:
    kunica:
      - conica          # Vosk grande: "Kunica" -> "cônica"
      - iconica         # Vosk grande: "Ei Kunica" -> "a icônica"
      - nika            # Whisper: "Kunica" -> "com Nika."
    tvzinha:
      - tevzinha        # Whisper: "Oi TVzinha" -> "Oi, tevzinha!"
      - tevizinha
      - teve sozinha    # Vosk grande: "TVzinha" -> "teve sozinha"
      - oitenta vizinha # Vosk grande: "Oi TVzinha" -> "oitenta vizinha"
      - ate vizinha     # Whisper: "TVzinha" -> "Até vizinha!"
  follow_up_seconds: 8
  # Depois de uma resposta por voz, a conversa segue ativa por este tempo: falar já envia a
  # mensagem, sem repetir a alcunha. Passado o tempo sem fala, volta a exigir a alcunha.
  conversation_seconds: 60
  max_history_turns: 8
  session_ttl_minutes: 30
  # O que o assistente consegue fazer. Este catálogo vai no prompt do sistema (o modelo lê e pode
  # listar quando perguntarem “quais ferramentas você tem?”) e é o mesmo conteúdo de
  # GET /api/capabilities. Edite aqui para anunciar outra capacidade — e só o que estiver aqui.
  capabilities:
    - title: Clima e previsão do tempo
      detail: "previsão dos próximos 7 dias de uma cidade — ex.: “como fica o tempo em Itapecerica da Serra amanhã?”"
    - title: Esportes
      detail: "próximos jogos e resultados recentes — ex.: “quando é o próximo jogo do Corinthians?”"
    - title: Pesquisa na internet
      detail: "notícias, preços e cotações atuais em sites reais — ex.: “pesquisa na internet o preço do dólar”"
    - title: Memória
      detail: "guardar e listar o que você pede para eu lembrar — ex.: “grave que eu moro em Itapecerica da Serra”"
    - title: Hora e data
      detail: "consultar a hora, a data e o dia da semana atuais"
    - title: Cálculos básicos
      detail: "resolver contas e porcentagens simples"
    - title: Agenda e lembretes
      detail: "guardar e listar lembretes no volume persistente"
    - title: Lista de tarefas
      detail: "adicionar, consultar, concluir ou limpar a lista de tarefas"
    - title: Dicionário e tradução
      detail: "consultar definição de palavras ou tradução — ex.: ‘o que significa efêmero?’ ou ‘defina fotossíntese’"
    - title: Temporizadores
      detail: "programar um aviso após alguns segundos, minutos ou horas"
    - title: Notícias
      detail: "pesquisar as principais notícias atuais na internet"
    - title: Cotações
      detail: "consultar câmbio de dólar/euro e preços de Bitcoin/Ethereum"
    - title: Entretenimento
      detail: "pedir piadas e curiosidades ao assistente"
    - title: Música do Jellyfin
      detail: "listar bibliotecas, artistas e gêneros; tocar uma faixa por nome ou artista, ou escolher uma aleatória"
    - title: Modo estudo e flashcards
      detail: "fazer quizzes por voz ou texto, responder uma pergunta de cada vez, receber correções e uma nota — ex.: “me faça 5 perguntas sobre fotossíntese”"
