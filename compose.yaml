name: assistente-local

services:
  backend:
    build: ./backend
    profiles: [core]
    environment:
      ASSISTANT_CONFIG: /app/config/assistant.yaml
      VOSK_MODEL_PATH: /models/${VOSK_MODEL_NAME:-vosk-model-small-pt-0.3}
      # Motor de fala: 'whisper' entende bem mais em português; 'vosk' é leve e offline.
      STT_ENGINE: ${STT_ENGINE:-whisper}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      # Núcleos dedicados ao Whisper (0 = todos). Em máquina fraca use 2: o modelo de linguagem e o
      # sintetizador de voz disputam a mesma CPU.
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-0}
      # Feixes do decoder (1 = guloso; 5 = padrão, bem mais preciso em fala espontânea).
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-5}
      # Opcional: frase que enviesa o reconhecedor (nomes, jargão). Vazio = nome + alcunhas.
      WHISPER_INITIAL_PROMPT: ${WHISPER_INITIAL_PROMPT:-}
      # O modelo do Whisper fica no volume persistente (baixa uma única vez).
      WHISPER_CACHE_DIR: /data/whisper
      # Motor de síntese: 'kokoro' (imagem ~1,5 GB, voz pf_dora, porta 8880) ou
      # 'piper' (build local ~400-600 MB, voz feminina dii, porta 8890). O backend
      # resolve URL e voz a partir daqui; TTS_URL/TTS_VOICE (opcionais) sobrepõem.
      TTS_ENGINE: ${TTS_ENGINE:-kokoro}
      TTS_URL: ${TTS_URL:-}
      TTS_VOICE: ${TTS_VOICE:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      # Janela de contexto por requisição (options.num_ctx). 2048 é o ponto ideal
      # em CPU: cobre o chat + ferramenta sem o prefill lento do padrão (32k).
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-2048}
      # Threads por requisição (options.num_thread). 0 = Ollama decide.
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-0}
      # Desliga o thinking (Gemma 4, Qwen3...) por padrão: sem think=false o
      # raciocínio consome o num_predict e o content volta vazio.
      OLLAMA_THINK: ${OLLAMA_THINK:-false}
      # Preenchida pelo bootstrap (scripts/ensure-ollama.sh): a outra instância, usada
      # como reserva quando a principal não responde.
      OLLAMA_FALLBACK_URL: ${OLLAMA_FALLBACK_URL:-}
      CHAT_TIMEOUT_SECONDS: ${CHAT_TIMEOUT_SECONDS:-180}
      MAX_MESSAGE_CHARS: ${MAX_MESSAGE_CHARS:-4000}
      MAX_RESPONSE_TOKENS: ${MAX_RESPONSE_TOKENS:-400}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      MEMORY_DIR: /data
      MAX_MEMORIES: ${MAX_MEMORIES:-200}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/assistant.yaml:/app/config/assistant.yaml:ro
      - ./backend/models:/models:ro
      # Volume nomeado do Docker: guarda o que o usuário pede para lembrar.
      # Sobrevive a 'down'/'up' e à recriação do container, então as informações
      # continuam disponíveis como base para sessões futuras.
      - assistant-data:/data
    expose: ["8000"]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    profiles: [core]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s

  kokoro:
    # Kokoro-FastAPI na variante CPU: ~1,5 GB, com o modelo v1_0 e as vozes já
    # embutidos (inclui a feminina pt-BR pf_dora). Sem GPU e sem download no boot,
    # então a síntese funciona offline depois do primeiro pull. O contrato é o
    # mesmo /v1/audio/speech que o backend consome. Para trocar de fonte, defina
    # TTS_IMAGE em .env.
    image: ${TTS_IMAGE:-ghcr.io/remsky/kokoro-fastapi-cpu:latest}
    profiles: [tts-kokoro]
    environment:
      PORT: "8880"
      DEVICE: cpu
      USE_GPU: "false"
      DOWNLOAD_MODEL: "false"
    expose: ["8880"]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8880/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  piper:
    # TTS leve: Piper (VITS) pt-BR, voz feminina dii, via sherpa-onnx (CPU).
    # O build embute o modelo (~64 MB), então a imagem final fica em ~400-600 MB
    # e a síntese funciona offline depois do build — sem download no bootstrap.
    # Mesmo contrato /v1/audio/speech que o backend consome.
    build: ./piper
    profiles: [tts-piper]
    environment:
      PIPER_VOICE: ${PIPER_VOICE:-dii}
      PIPER_THREADS: ${PIPER_THREADS:-2}
    expose: ["8890"]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8890/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  # Storage do Docker para a memória do assistente (ver backend/app/memory.py).
  # Inspecionar: docker volume inspect assistente-local-data
  # Apagar tudo: docker compose --env-file .env --profile core --profile tts-kokoro down -v
  # (ou --profile tts-piper, conforme o TTS_ENGINE em uso)
  assistant-data:
    name: assistente-local-data
